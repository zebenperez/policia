{% load i18n static %}

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
        <meta name="description" content="{% trans "IA Denuncias"%}">
        <meta name="author" content="{% trans "" %}">

        <link rel="stylesheet" href="{% static "css/login.css"%}" type="text/css"/>

        <!-- Bootstrap core CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

        <!-- Font awesome -->
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">

        <!-- JQuery -->
        <script src="https://code.jquery.com/jquery-3.5.1.js" ></script>
	<script src="https://cdn.tailwindcss.com"></script>

        <title>{% trans "IAPol"%}</title>
    </head>


    <body>
        <div class="main-screen p-4">
            <div class="main-container">
	            <div class="row">
		            <div class="col-lg-12 col-12 app-name py-2 text-center">IAPol</div>
		            <div class="col-lg-12 col-12 py-2">
			            <div class="login-container">
				            <h2>Registro</h2><br />
	               	        <p>Crea una cuenta para IAPol y selecciona el plan que prefieras</p>
			            </div>
			            <div class="login-form text-center px-4">
				            {% block login-right %}
					            {% include "login_form.html" %}
				            {% endblock %}
			            </div>
		            </div>

		            <div class="col-12 p-4"> {% include "login-plans.html" %} </div>
		        </div>
	        </div>
        </div>
    </body>
</html>
