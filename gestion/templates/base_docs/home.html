{% extends "base.html" %}
{% load i18n static %}


{% block central_content%}

<div class="row top-inner-content m-">
	<div class="col-lg-10">
	        <h2 class="mb-4">Listado de Documentos</h2>
	</div>
	<div class="col-lg-2 text-end">
		<label for ="file" class="btn-primary py-2 px-4">
			<i class="fas fa-upload"></i>&nbsp; {%trans "Elegir"%}&nbsp;{%trans "Archivo"%}
		</label>
		<input type="file" class="multiupload d-none" name="file" id="file" 
			data-url="{%url 'base-docs-upload'%}" data-target="div-docs" data-obj-id="{{obj.id}}" 
			data-csrf-token="{{ csrf_token }}" multiple/>
	</div>
</div>

<div id="div-docs">{% include "base_docs/doc-list.html" %}</div>

{% endblock %}
