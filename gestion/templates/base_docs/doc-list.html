{% load i18n %}

<ul class="list-group">
    {% for doc in item_list %}

            <button class="btn btn-xs ark" data-url="{% url "base-docs-remove" %}" data-target="div-docs" data-obj_id="{{doc.id}}">
                <i class="fas fa-trash"></i></button> 
        </li>
    {% endfor %}
</ul>
