<style>
    .container {
        max-width: 500px;
        min-height: 630px;
        width: 100%;
        background-color: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        transition: transform 0.3s ease;
    }
    
    .container:hover {
        transform: translateY(-5px);
    }
    
    .header {
        background: linear-gradient(to right, #4a00e0, #8e2de2);
        color: white;
        padding: 25px;
        text-align: center;
    }
    
    .header h1 {
        font-size: 1.8rem;
        margin-bottom: 5px;
        font-weight: 600;
    }
    
    .header p {
        opacity: 0.9;
        font-size: 0.95rem;
    }
    
    .recorder-container {
        padding: 30px;
    }
    
    .visualizer {
        height: 120px;
        background: linear-gradient(to bottom, #f8f9fa, #e9ecef);
        border-radius: 12px;
        margin-bottom: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        border: 1px solid #e0e0e0;
    }
    
    .visualizer-content {
        text-align: center;
        color: #6c757d;
        z-index: 1;
    }
    
    .visualizer-content i {
        font-size: 2.5rem;
        margin-bottom: 10px;
        color: #1b263a;
    }
    
    .visualizer-bars {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: space-around;
        padding: 0 10px;
    }
    
    .bar {
        width: 8px;
        background: linear-gradient(to top, #d2bc82, #1b263a);
        border-radius: 4px 4px 0 0;
        transition: height 0.2s ease;
    }
    
    .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 25px;
    }
    
    .btn {
        border: none;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1.3rem;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    
    .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    
    .btn-record {
        background: linear-gradient(to bottom right, #ff416c, #ff4b2b);
        color: white;
    }
    
    .btn-stop {
        background: linear-gradient(to bottom right, #11998e, #38ef7d);
        color: white;
    }
    
    .btn-play {
        background: linear-gradient(to bottom right, #2193b0, #6dd5ed);
        color: white;
    }
    
    .btn-upload {
        background: linear-gradient(to bottom right, #8e2de2, #4a00e0);
        color: white;
    }
    
    .btn:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }
    
    .audio-preview {
        width: 100%;
        margin: 20px 0;
        border-radius: 10px;
        overflow: hidden;
    }
    
    .status {
        text-align: center;
        padding: 12px;
        border-radius: 10px;
        margin-top: 15px;
        font-weight: 500;
        transition: all 0.3s ease;
    }
    
    .status.recording {
        background-color: #ffeaea;
        color: #ff416c;
        animation: pulse 1.5s infinite;
    }
    
    .status.ready {
        background-color: #e8f5e9;
        color: #2e7d32;
    }
    
    .status.sending {
        background-color: #e3f2fd;
        color: #1565c0;
    }
    
    .timer {
        text-align: center;
        font-size: 1.5rem;
        font-weight: 600;
        color: #1b263a;
        margin: 15px 0;
        font-family: 'Courier New', monospace;
    }
    
    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.7; }
        100% { opacity: 1; }
    }
    
    .footer {
        text-align: center;
        padding: 15px;
        font-size: 0.85rem;
        color: #6c757d;
        border-top: 1px solid #e9ecef;
    }
    
    @media (max-width: 480px) {
        .controls {
            flex-wrap: wrap;
        }
        
        .btn {
            width: 50px;
            height: 50px;
            font-size: 1.1rem;
        }
        
        .header h1 {
            font-size: 1.5rem;
        }
    }
</style>
<div class="container p-0">
    <!--
    <div class="header">
        <h1><i class="fas fa-microphone"></i> Grabadora de Audio</h1>
        <p>Graba y envía audio de alta calidad</p>
    </div>
    -->
    
    <div class="recorder-container">
        <div class="visualizer">
            <div class="visualizer-content"><i class="fas fa-microphone-alt"></i> <p>Presiona el botón para comenzar a grabar</p></div>
            <div class="visualizer-bars" id="visualizer"></div>
        </div>
        
        <div class="timer" id="timer">00:00</div>
        
        <div class="row">
            <div class="col-4 text-center">
                <button class="btn btn-record" id="startRecord"><i class="fas fa-microphone-alt"></i></button><br/> INICIAR GRABACIÓN
            </div>
            <div class="col-4 text-center">
                <button class="btn btn-stop" id="stopRecord" disabled><i class="fas fa-stop"></i></button><br/> PARAR GRABACIÓN 
            </div>
            <div class="col-4 text-center">
                <button class="btn btn-play" id="playRecord" disabled><i class="fas fa-play"></i></button><br/> REPRODUCIR GRABACIÓN
            </div>
            <div class="col-3 text-center hide">
                <button class="btn btn-upload" id="uploadRecord" disabled><i class="fas fa-upload"></i></button><br/> GUARDAR GRABACIÓN
            </div>
        </div>
        
        <div class="audio-preview"> <audio id="audioPreview" controls style="width: 100%; display: none;"></audio> </div>
        
        <div class="status" id="status">Listo para grabar</div>
    </div>
   <!-- 
    <div class="footer"> <p>La grabación requiere permiso para usar el micrófono</p> </div>
   -->
</div>

<script>
    $(document).ready(function() {
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob;
        let timerInterval;
        let seconds = 0;
        let secondsp = 0;
        let audioContext;
        let analyser;
        let dataArray;
        let bufferLength;
        let bars = [];
        
        // Crear barras del visualizador
        function createVisualizerBars() {
            const visualizer = $('#visualizer');
            visualizer.empty();
            bars = [];
            
            for (let i = 0; i < 20; i++) {
                const bar = $('<div class="bar"></div>');
                bar.height(5 + Math.random() * 20);
                visualizer.append(bar);
                bars.push(bar);
            }
        }
        
        // Actualizar visualizador
        function updateVisualizer() {
            if (!analyser) return;
            
            analyser.getByteFrequencyData(dataArray);
            
            for (let i = 0; i < bufferLength; i++) {
                const value = dataArray[i];
                const height = value / 2;
                
                if (bars[i]) {
                    bars[i].height(height);
                    bars[i].css('height', height + 'px');
                }
            }
            
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                requestAnimationFrame(updateVisualizer);
            }
        }
        
        // Inicializar visualizador
        createVisualizerBars();
        
        // Formatear tiempo
        function formatTime(secs) {
            const minutes = Math.floor(secs / 60);
            const seconds = secs % 60;
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        // Actualizar temporizador
        function updateTimer() {
            seconds++;
            $('#timer').text(formatTime(seconds));
        }
        
        function updateTimerP() {
            secondsp++;
            $('#timerp').text(formatTime(secondsp));
        }

        // Iniciar grabación
        $('#startRecord').click(async function() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // Configurar analizador de audio para el visualizador
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                analyser.fftSize = 64;
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    //const audioUrl = URL.createObjectURL(audioBlob);
                    
                    //$('#audioPreview').attr('src', audioUrl).show();
                    $('#playRecord, #uploadRecord').prop('disabled', false);
                    $('#status').removeClass('recording').addClass('ready').text('Grabación completada');
                    
                    // Detener el temporizador
                    clearInterval(timerInterval);
                    $('.visualizer-content p').text('Grabación completada');
                    setTimeout(()=>{$("#uploadRecord").click()}, 1000);
                };
                
                mediaRecorder.start();
                $('#startRecord').prop('disabled', true);
                $('#stopRecord').prop('disabled', false);
                $('#status').removeClass('ready').addClass('recording').text('Grabando...');
                $('.visualizer-content p').text('Grabando audio...');
                
                // Iniciar temporizador
                seconds = 0;
                $('#timer').text('00:00');
                timerInterval = setInterval(updateTimer, 1000);
                
                // Iniciar visualizador
                updateVisualizer();
                
            } catch (error) {
                console.error('Error al acceder al micrófono:', error);
                $('#status').text('Error: No se pudo acceder al micrófono').css('background-color', '#ffebee').css('color', '#c62828');
            }
        });
        
        // Detener y subir la grabación
        $('#stopRecord').click(function() {
            // Parar la grabación
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                
                $('#startRecord').prop('disabled', false);
                $('#stopRecord').prop('disabled', true);
                
                if (audioContext) {
                    audioContext.close();
                }
            }
        });
        
        // Reproducir grabación
        $('#playRecord').click(function() {
            const audioPreview = document.getElementById('audioPreview');
            if (audioPreview.paused) {
                audioPreview.play();
                $(this).html('<i class="fas fa-pause"></i>');
            } else {
                audioPreview.pause();
                $(this).html('<i class="fas fa-play"></i>');
            }
        });
        
        // Reiniciar botón de reproducción cuando termina el audio
        $('#audioPreview').on('ended', function() {
            $('#playRecord').html('<i class="fas fa-play"></i>');
        });
        
        // Enviar audio a servidor
        $('#uploadRecord').click(function() {
            if (!audioBlob) {
                $('#status').text('No hay audio grabado').css('background-color', '#ffebee').css('color', '#c62828');
                return;
            }
            
            const formData = new FormData();
            formData.append('audio', audioBlob, 'grabacion.wav');
            formData.append('timestamp', new Date().toISOString());
            formData.append('report', '{{report.id}}');
            formData.append('csrfmiddlewaretoken', '{{csrf_token}}');
            
            $('#status').removeClass('ready').addClass('sending').text('Enviando audio...');
            $('#uploadRecord').prop('disabled', true);
            
            // Simulación de envío (reemplaza con tu URL real)
            /*setTimeout(function() {
                $('#status').removeClass('sending').addClass('ready').text('Audio enviado correctamente');
                $('#uploadRecord').prop('disabled', false);
                
                // Simulación de respuesta exitosa
                console.log('Audio enviado al servidor');
            }, 2000);*/
            
            // Código real para enviar (descomenta y ajusta la URL)
            setProcess();
            secondsp = 0;
            $('#timerp').text('00:00');
            timerInterval = setInterval(updateTimerP, 1000);
            $.ajax({
                url: '{% url "agents-audio-save" %}',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(response) {
                    unsetProcess();
                    window.location.href = '{% url "agents-report" report.id %}';
                    //$('#status').removeClass('sending').addClass('ready').text('Audio enviado correctamente');
                    //$('#audioPreview').hide();
                    //console.log('Respuesta del servidor:', response);
                },
                error: function(xhr, status, error) {
                    errorProcess(error);
                    $('#status').text('Error al enviar el audio').css('background-color', '#ffebee').css('color', '#c62828');
                    console.error('Error:', error);
                    $('#uploadRecord').prop('disabled', false);
                }
            });
            
        });
    });
</script>
