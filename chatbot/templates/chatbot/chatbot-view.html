<style>
    .chatbot-container {
        min-height: 630px;
        border-radius: 0.5rem;
        overflow: hidden;
        border-radius: 20px;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    }

    .chat-header {
        background: #e3d394;
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .chat-header i {
        color: #001538;
        font-size: 0.9rem;
    }
    .chat-header h3 {
        color: #001538;
        font-size: 0.8rem;
        text-transform: uppercase;
        font-weight: 600;
    }
    .status-dot {
        width: 10px;
        height: 10px;
        background: #4cd964;
        border-radius: 50%;
    }

    .chat-messages {
        height: 500px;
        overflow-y: auto;
        padding: 1rem;
        background: #f8f9fa;
    }

    .message {
        margin-bottom: 1rem;
        padding: 0.8rem;
        border-radius: 15px;
        max-width: 70%;
    }

    .user-message {
        background: #ddd;
        color: black;
        margin-left: auto;
        border-bottom-right-radius: 5px;
    }

    .bot-message {
        background: white;
        border: 1px solid #ddd;
        margin-right: auto;
        border-bottom-left-radius: 5px;
    }

    .chat-input-container {
        display: flex;
        padding: 1rem;
        background: white;
        border-top: 1px solid #ddd;
    }

    #userInput {
        flex: 1;
        padding: 0.8rem;
        border: 1px solid #ddd;
        border-radius: 25px;
        margin-right: 0.5rem;
    }

    #sendButton {
        background: #2575fc;
        color: white;
        border: none;
        border-radius: 50%;
        width: 45px;
        height: 45px;
        cursor: pointer;
    }
    #sendButton i {
        color: #ffffff;
    }

    #uploadFileButton {
        background: #6c757d;
        color: white;
        border: none;
        border-radius: 50%;
        width: 45px;
        height: 45px;
        cursor: pointer;
        margin-left: 0.5rem;
    }
    #uploadFileButton i {
        color: #ffffff;
    }
</style>

<div class="chatbot-container">
    <div class="chat-header">
        <h3><i class='far fa-comment-dots'></i> Asistente Virtual</h3>
        <span class="status-dot"></span>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">
            ¡Hola! ¿En qué puedo ayudarte hoy?
        </div>
        <div class="message bot-is-typing bot-message" id="botTyping" style="display: none;">
            <i class="fas fa-ellipsis-h"></i>
            <span><i><small>Escribiendo...</small></i></span>
        </div>
    </div>

    
    <div class="chat-input-container">
        <input type="text" id="userInput" placeholder="Escribe tu mensaje...">
        <button id="sendButton" class="send-to-llm" data-url="{% url 'agents-chat-with-llm' %}" data-report_id="{{ report.id }}">
            <i class="fas fa-paper-plane"></i>
        </button>
        <button id="uploadFileButton" class="upload-file" data-url="{% url 'agents-upload-file-to-llm' %}" data-report_id="{{ report.id }}">
            <i class="fas fa-paperclip"></i>
        </button>
    </div>
</div>

<script>
    // Widget for upload file
    document.getElementById('uploadFileButton').addEventListener('click', function() {
        const reportId = this.getAttribute('data-report_id');
        const uploadUrl = this.getAttribute('data-url');
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.pdf,.doc,.docx,.txt'; // Acceptable file types
        fileInput.style.display = 'none';
        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('report_id', reportId);
                formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

                fetch(uploadUrl, {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert('Archivo subido exitosamente.');
                    } else {
                        alert('Error al subir el archivo.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error de conexión. Intenta nuevamente.');
                });
            }
        });
        document.body.appendChild(fileInput);
        fileInput.click();
        document.body.removeChild(fileInput);
    });




    document.addEventListener('DOMContentLoaded', function() {
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        function addMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = isUser ? 'message user-message' : 'message bot-message';

            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);

            // Hide typing indicator if it's a bot message
            if (!isUser) {
                const botTyping = document.getElementById('botTyping');
                botTyping.style.display = 'none';
            }
            else {

                // Show typing indicator for bot response
                const botTyping = document.getElementById('botTyping');
                // Cut typing indicator and paste to the end
                chatMessages.appendChild(botTyping);
                botTyping.style.display = 'block';
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';
            try {
                var report_id = $(sendButton).data('report_id');

                $.ajax({
                    url: $(sendButton).data('url'),
                    type: 'POST',
                    data: {
                        'report_id': report_id,
                        'message': message,
                        'csrfmiddlewaretoken': $('input[name="csrfmiddlewaretoken"]').val()
                    },
                    success: function(response) {
                        if (response.status === 'success') {
                            addMessage(response.message);
                        } else {
                            addMessage('Lo siento, ha ocurrido un error.');
                        }
                    },
                    error: function(xhr, status, error) {
                        addMessage('Error de conexión. Intenta nuevamente.');
                    }
                });
            
            } catch (error) {
                console.error('Error:', error);
                addMessage('Error de conexión. Intenta nuevamente.');
            }
        }
        
        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    });
</script>
