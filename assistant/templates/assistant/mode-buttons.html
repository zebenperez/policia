{% load static i18n pwa_tags %}

<div class="row div-mode-buttons m-0 p-0">
    {% for sub in submode_list %}
        <div class="col-3 p-0">
            <div class="btn text-center py-2 px-0 w-100" style="background:{{sub.color}}">
                <button class="btn btn-mode px-0" 
                    data-value="{{sub.code}}" data-title="{{sub.title}}" data-color="{{sub.color}}" data-block="{{sub.block}}"
                       {% if sub.code in submode.block %}disabled{%endif%}>{{sub.name|safe}}</button>
    	    </div>
        </div>
    {% endfor %}
</div>

<script>
    $(".btn-mode").click(function(){
        $(".btn-mode").removeClass("text-primary").addClass("text-white");
        $(this).addClass("text-primary").removeClass("text-white");
        $("#text-input").attr("data-submode", $(this).data('value'));
        $("#bar-mode").css("background", $(this).data('color'));
        $("#bar-mode > div").html("MODO "+$(this).data('title'));

        let block_list = $(this).data("block").split(",");
        block_list.forEach(function(value, index) {
            $(`button[data-value="${value}"]`).prop('disabled', true);
        });
    });
</script>
