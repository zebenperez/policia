{% load static i18n pwa_tags %}

<div class="row div-mode-buttons m-0 pb-2 p-0">
    <div class="col-4 px-1">
    	<div class="btn-urgency text-center py-4">
	    <button class="btn btn-mode text-white px-0" data-value="urgencia"> <strong>URGENCIA</strong> </button>
    	</div>
    </div>
    <div class="col-4 px-1">
    	<div class="btn-intervenc text-center py-4">
            <button class="btn btn-mode text-white px-0" data-value="intervencion"> <strong>INTERVENCIÓN</strong> </button>
    	</div>
    </div>
    <div class="col-4 px-1">
    	<div class="btn-consult text-center py-4">
            <button class="btn btn-mode text-white px-0" data-value="consulta"> <strong>CONSULTA</strong></button>
	    </div>
    </div>
</div>

<script>
    $(".btn-mode").click(function(){
        $(".btn-mode").removeClass("text-primary").addClass("text-white");
        $(this).addClass("text-primary").removeClass("text-white");
        $("#text-input").attr("data-mode", $(this).data('value'));
    });
</script>
