{#<div class="flex-shrink-0 px-2 py-2 border-t border-white/10 bg-black/20 backdrop-blur-sm">#}
<div class="flex-shrink-0 px-2 py-2">
    <div id="recording-indicator" class="hidden mb-4">
        <div class="flex items-center justify-center gap-3 py-3">
            {%comment%}
            <div class="flex items-end gap-1 h-8">
                <div class="recording-wave w-1 bg-red-400 rounded-full" style="animation-delay: 0s;"></div>
                <div class="recording-wave w-1 bg-red-400 rounded-full" style="animation-delay: 0.1s;"></div>
                <div class="recording-wave w-1 bg-red-400 rounded-full" style="animation-delay: 0.2s;"></div>
                <div class="recording-wave w-1 bg-red-400 rounded-full" style="animation-delay: 0.3s;"></div>
                <div class="recording-wave w-1 bg-red-400 rounded-full" style="animation-delay: 0.4s;"></div>
            </div>
            {%endcomment%}
            <span class="text-red-400 text-sm font-medium">Grabando (20 seg)...</span> 
            <span id="recording-time" class="text-white/50 text-sm">0:00</span>
        </div>
    </div>

    <div class="flex flex-col items-center gap-2">

        <button id="mic-btn" type="button" class="btn btn-primary btn-voice"><i class="fa fa-microphone"></i>
            <div id="mic-pulse" class="absolute inset-0 bg-white/20 rounded-full pulse-ring hidden"></div>
        </button>

        {#<p id="mic-instruction" class="text-center text-white/40 text-sm mt-1 font-medium">Toca el micrófono para comenzar</p>#}
 
	    <button id="btn-stop-speak" type="button" class="btn btn-danger btn-voice" style="background-color:#ff0000;display:none">
            <i class="fa fa-pause"></i>
        </button>

<!--
        <button id="btn-stop-speak" class="w-20 h-20 rounded-full flex items-center justify-center text-white transition-all hover:scale-105 active:scale-95 relative overflow-hidden shadow-2xl" style="background-color:#ff0000;display:none">
            <svg class="w-9 h-9 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">

            </svg>

        {%comment%}
        <div class="flex items-center gap-3 w-full"><!-- Text Input -->
            <div class="flex-1 relative">
                <input type="text" id="text-input" placeholder="O escribe tu situación..." data-mode="urgencia"
                    class="w-full bg-white/10 border border-white/10 rounded-full px-5 py-3 text-white placeholder-white/40 text-sm focus:outline-none  focus:bg-white/15 transition-all">
            </div>
            <button id="send-btn" class="w-12 h-12 rounded-full flex items-center justify-center text-white transition-all hover:scale-105 active:scale-95 disabled:opacity-50 disabled:hover:scale-100" style="background-color:#0b5ed7;">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8">
                    </path> 
                </svg>
            </button>
        </div>
        {%endcomment%}

</div>
