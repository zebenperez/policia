{% load static i18n pwa_tags %}


<header class="flex-shrink-0 px-2 py-2 flex items-center gap-4 border-b border-white/10">
    <div class="relative">
        <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background-color:#0b5ed7;">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072
                    0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
            </svg>
        </div>
        <div class="absolute -bottom-0.5 -right-0.5 w-4 h-4 bg-emerald-400 rounded-full border-2 border-[#1a1a2e]"></div>
    </div>
    <div class="flex-1">
        <h1 id="assistant-name" class="text-white font-semibold text-lg">IAPol</h1>
        <p class="text-white/50 text-sm">Asistente de decisiones</p>
        {%comment%}
        <p class="text-white/50 text-sm">
            Se encuentra con un perfil <strong>{{group}}</strong> y tiene <strong>{{msg_num}}</strong> mensajes permitidos</p>
        {%endcomment%}
    </div>
    <button 
        class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-white/60 hover:bg-white/10 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 
                2z"></path> 
        </svg>
    </button>
</header><!-- Priority Legend -->
