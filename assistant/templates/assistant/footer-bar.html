{% load i18n assistant_tags %}

<div class="row div-footer-bar m-0 py-2">
	<div class="col-3 text-center px-0">
        <a class="" href="{%url "assistant-chat" "intervention"%}">
            <span id="btn-int" class="badge bg-dark mr-2"></span><i class="fas fa-comment-dots"></i> <br/><small>Intervención</small>
        </a>
    </div>
	<div class="col-3 text-center px-0"> <a class="" href="{%url "assistant-chat" "consultation"%}">
            <span id="btn-con" class="badge bg-dark mr-2">3</span><i class="far fa-comment-dots"></i> <br/><small>Consulta</small>
        </a> 
    </div>
	<div class="col-3 text-center px-0"> 
        <a class="" href="{%url "chat-list"%}">
            <span id="btn-all" class="badge bg-dark mr-2">3</span><i class="fas fa-layer-group"></i> <br/><small>Interacciones</small>
        </a> 
    </div>
	<div class="col-3 text-center px-0">
		 <form action="{% url 'auth_logout' %}" method="post" id="frmLogout" class="m-0">
		    {% csrf_token %}
		    <a onclick="$('#frmLogout').submit();" title="Salir"> <i class="fas fa-sign-out-alt"></i></a><br/><small>Salir</small>
		</form>
	</div>
</div>
<script>
    let url = '{% url "chat-report-count" %}';
    ajaxGet(url, {"mode": "intervention"}, "btn-int", "");
    ajaxGet(url, {"mode": "consultation"}, "btn-con", "");
    ajaxGet(url, {"mode": ""}, "btn-all", "");
</script>
