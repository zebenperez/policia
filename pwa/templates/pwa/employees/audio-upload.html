<style>
    .upload-container {
        border: 2px dashed #d1d1d1;
        border-radius: 15px;
        padding: 40px 20px;
        text-align: center;
        transition: all 0.3s ease;
        margin-bottom: 30px;
        position: relative;
    }
    
    .upload-container:hover {
        border-color: #6a11cb;
        background: #f9f9ff;
    }
    
    .upload-container.dragover {
        border-color: #2575fc;
        background: rgba(37, 117, 252, 0.05);
        transform: scale(1.02);
    }
    
    .upload-icon {
        font-size: 60px;
        color: #6a11cb;
        margin-bottom: 15px;
    }
    
    .upload-text {
        margin-bottom: 20px;
    }
    
    .upload-text h3 {
        color: #333;
        margin-bottom: 10px;
    }
    
    .upload-text p {
        color: #666;
        font-size: 14px;
    }
    
    .audio {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        opacity: 0;
        cursor: pointer;
    }
    
    .browse-btn {
        display: inline-block;
        padding: 12px 30px;
        background: linear-gradient(to right, #6a11cb, #2575fc);
        color: white;
        border-radius: 50px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 5px 15px rgba(106, 17, 203, 0.3);
    }
    
    .browse-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(106, 17, 203, 0.4);
    }
    
    .file-info {
        background: #f0f4ff;
        border-radius: 10px;
        padding: 20px;
        margin-top: 20px;
        display: none;
    }
    
    .file-info h4 {
        color: #333;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .file-label {
        font-weight: 600;
        color: #555;
    }
    
    .file-value {
        color: #2575fc;
        font-weight: 500;
    }
    
    .upload-btn {
        display: block;
        width: 100%;
        padding: 15px;
        background: linear-gradient(to right, #6a11cb, #2575fc);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 20px;
        box-shadow: 0 5px 15px rgba(106, 17, 203, 0.3);
    }
    
    .upload-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(106, 17, 203, 0.4);
    }
    
    .upload-btn:disabled {
        background: #cccccc;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }
    
    @media (max-width: 480px) {
        .container {
            border-radius: 15px;
        }
        
        .upload-container {
            padding: 30px 15px;
        }
    }
</style>

<div class="upload-container" id="upload-container">
    <div class="upload-icon">
        <i class="fas fa-music"></i>
    </div>
    
    <div class="file-info" id="file-info">
        <h4><i class="fas fa-file-audio"></i> Información del archivo</h4>
        <span class="file-label">Nombre:</span>
        <span class="file-value" id="file-name">-</span>
    </div>
    
    <div class="browse-btn"> <i class="fas fa-search"></i> Grabar Audio </div>
    
    <input type="file" class="audio" id="audio" accept="audio/*">
</div>


<button type="submit" class="upload-btn" id="upload-btn" disabled> <i class="fas fa-cloud-upload-alt"></i> Subir Audio </button>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const fileInput = document.getElementById('audio');
        const uploadContainer = document.getElementById('upload-container');
        const fileInfo = document.getElementById('file-info');
        const uploadBtn = document.getElementById('upload-btn');
        const fileName = document.getElementById('file-name');
        
        // Evento cuando se selecciona un archivo
        fileInput.addEventListener('change', function() {
            console.log("-1---");
            if (fileInput.files.length) {
                handleFileSelection(fileInput.files[0]);
            }
        });
        
        // Función para manejar la selección de archivos
        function handleFileSelection(file) {
            // Mostrar información del archivo
            fileName.textContent = file.name;
            
            fileInfo.style.display = 'block';
            
            // Habilitar botón de subida
            uploadBtn.disabled = false;
        }
    });
</script>
