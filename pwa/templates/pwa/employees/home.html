{% extends "pwa-base.html" %}
{% load static i18n pwa_tags %}

{% block content%}
    <div class="col-12 p-2 mt-3">
        <div class="text-start my-2">
            <form method="post" action="{% url "pwa-employee-audio-save" %}" id="frmService" enctype="multipart/form-data">
                {% csrf_token %}
                <i class="fas fa-microphone orange"></i> <strong>{% trans "Audio" %}</strong><br />
                {#<input type="file" id="audio" name="audio" accept="audio/*;capture=microphone" />#}
                <input type="file" id="audio" name="audio" accept="audio/*" capture="user" />
                <br/> <br/>
                {#<input type="submit" class="btn-primary w-100 py-3" value="{% trans "Enviar" %}"/>#}
		<button type="submit" class="btn-primary w-100 py-3" value="{% trans "Enviar" %}">{% trans "Enviar" %}</button>



                {%comment%}
                <!-- Input oculto que contendrá el audio -->
        <input type="hidden" id="audioInput" name="audio_data">

        <!-- Campos adicionales del formulario -->
        <input type="text" name="nombre" placeholder="Nombre del audio">

        <button type="button" id="startBtn">🎤 Grabar Audio</button>
        <button type="button" id="stopBtn" disabled>⏹️ Detener</button>

        <audio id="audioPlayback" controls></audio>
        <p id="status">Presiona 'Grabar Audio' para comenzar</p>

        <button type="submit" id="submitBtn" disabled>📤 Enviar Formulario</button>
            </form>
        </div>
                {%endcomment%}
    </div>

                {%comment%}
     <script>
        let mediaRecorder;
        let audioChunks = [];
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const submitBtn = document.getElementById('submitBtn');
        const audioPlayback = document.getElementById('audioPlayback');
        const audioInput = document.getElementById('audioInput');
        const statusText = document.getElementById('status');
        const form = document.getElementById('audioForm');

        // Solicitar acceso al micrófono
        startBtn.addEventListener('click', async () => {
            try {
                statusText.textContent = "Solicitando acceso al micrófono...";

                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        sampleRate: 44100
                    }
                });

                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'audio/webm'
                });

                audioChunks = [];
                          mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });

                    // Convertir blob a base64 para el input hidden
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        // El resultado en base64 se guarda en el input hidden
                        audioInput.value = reader.result;

                        // Habilitar el botón de enviar
                        submitBtn.disabled = false;
                    };
                    reader.readAsDataURL(audioBlob);

                    // Crear URL para reproducción
                    const audioUrl = URL.createObjectURL(audioBlob);
                    audioPlayback.src = audioUrl;

                    // Liberar el stream
                    stream.getTracks().forEach(track => track.stop());

                    statusText.textContent = "Grabación completada. Lista para enviar.";
                };
                         mediaRecorder.start();
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusText.textContent = "Grabando... Habla ahora.";

            } catch (error) {
                console.error('Error:', error);
                statusText.textContent = `Error: ${error.message}`;
            }
        });

        // Detener la grabación
        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        });

        // Prevenir envío del formulario hasta que haya audio
        form.addEventListener('submit', (e) => {
            if (!audioInput.value) {
                e.preventDefault();
                alert("Primero graba un audio");
            }
        });
    </script>
        {%endcomment%}
{% endblock %}
