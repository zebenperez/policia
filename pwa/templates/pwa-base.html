{% load i18n static gestion_tags %}

<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1,minimum-scale=1.0, maximum-scale=1.0">
		<!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->

		<title>IAPol</title>

		<!-- Latest compiled and minified CSS -->
		<link href='https://fonts.googleapis.com/css?family=Roboto Condensed' rel='stylesheet' type='text/css'>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

	        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
        	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        	{#<link rel="stylesheet" href="{% static "css/pwasim.css" %}?v={% random_str %}" type="text/css" /> #}
	        <link rel="stylesheet" href="{% static "css/pwa.css" %}" type="text/css" /> 
		<script src="https://code.jquery.com/jquery-3.1.1.min.js" integrity="sha256-hVVnYaiADRTO2PzUGmuLJr8BLUSjGIZsDYGmIJLv2b8=" crossorigin="anonymous"></script>    
		<!-- Bootstrap core CSS -->	
	        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

	        <!-- JQuery -->
        	<script src="https://code.jquery.com/jquery-3.5.1.js" ></script>
		<script src="https://cdn.tailwindcss.com"></script>

	</head>
    <body>
        <div class="container-fluid">
		<header>
		      <div class="header sticky-top px-3">
			    <div class="header-container py-2">
				<div class="header-elements">
				    <!-- Logo y nombre de la aplicación -->
				    <div class="logo-name space-x-3">
					<div class="app-logo">
			                    <img src="{% static "images/logo_IAPol-1.png" %}" alt="" height="50px" />
					</div>
				    </div>
	
				    <!-- Menu principal -->
					<div class="row main-menu w-50">
					    <div class="col-4 nav-item tab text-center pt-3 {% current 'home' %}">
						<a class="nav-link" href="{% url "pwa-employee" %}"> <i class='fas fa-microphone'></i><br>Grabar Denuncia</a>
					    </div>
					    <div class="col-4 nav-item tab text-center pt-3 {% current 'police' %}">
						<a class="nav-link" href="{% url "pwa-employee" %}"> <i class='fas fa-microphone'></i><br>Grabar Atestado</a>
					    </div>
					    <div class="col-4 nav-item tab text-center pt-3 {% current 'report' %}">
						<a class="nav-link" href="{% url "pwa-employee-reports" %}"> <i class="fa fa-file-audio-o"></i><br>Expedientes</a>
					    </div>
					    {% comment %}
					    <div class="col-3 nav-item tab text-center pt-3 {% current 'chatbot' %}">
						<a class="nav-link" href="{% url "pwa-employee-chatbot" %}"> <i class='fas fa-comment'></i><br>IA</a>
					    </div>
					    {% endcomment %}
					</div>
			    

				    <!-- Zona de usuario -->
				    <div class="user-area mt-1">
					<div class="dropdown">
					    <button class="space-x-2">
						<div class="profile-icon">
						    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
						    </svg>
						</div>
						<div class="profile-name">
						    <p class="name" id="userName">{{user.name}}Jesús / Alain</p>
						    <p class="category" id="userRole">Administrador</p>
						</div>
						<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
						    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
						</svg>
					    </button>
					    <div class="dropdown-content mt-2 py-2">
						<a href="#" class="px-4 py-2">Mi perfil</a>
						<a href="#" class="px-4 py-2">Configuración</a>
						<div class="p-0"> 
						    <form action="{% url 'auth_logout' %}" method="post" id="frmLogout" class="m-0">
							{% csrf_token %}
							<a class="close px-4 py-2 pointer" onclick="$('#frmLogout').submit();" title="Salir">
						    </form> Cerrar sesión</a>
						</div>
					    </div>
					</div>
				    </div>
				</div>
			    </div>
		    </div>
		</header>

            <div class="row content align-middle m-0" id="div-content">
                {% block content %} {% endblock %}
            </div>
        </div>
        <script>
            function checkOnlineStatus() 
            {
                $('#conn-status').html('Actualizando...');
                online_status = (navigator.onLine) ? 'Conectado':'Sin conexión';
                $('#conn-status').html(online_status);
                setTimeout(checkOnlineStatus, 5000);
            }
            checkOnlineStatus();
        </script>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const datetimes = document.querySelectorAll(".datetime");

                datetimes.forEach(el => {
                    const utcString = el.textContent.trim(); 

                    // Convertir a objeto Date (formato DD-MM-YYYY HH:mm)
                    const [day, month, yearAndTime] = utcString.split("-");
                    const [year, time] = yearAndTime.split(" ");
                    const isoString = `${year}-${month}-${day}T${time}:00Z`; // formato ISO en UTC
                    const date = new Date(isoString);

                    // Obtener componentes en hora local
                    const dd = String(date.getDate()).padStart(2, '0');
                    const mm = String(date.getMonth() + 1).padStart(2, '0'); // Meses 0-11
                    const yyyy = date.getFullYear();
                    const hh = String(date.getHours()).padStart(2, '0');
                    const min = String(date.getMinutes()).padStart(2, '0');

                    el.textContent = `${dd}-${mm}-${yyyy} ${hh}:${min}`;
                });
            });
        </script>

    </body>
</html>
